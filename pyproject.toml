[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vrach-backend"
version = "0.1.0"
description = "Backend ассистента комиссии по трудным жизненным ситуациям."
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "rapidfuzz>=3.9,<4",
    "python-multipart>=0.0.22,<1",
    "python-dotenv>=1,<2",
    "gigachat==0.2.0",
    "httpx>=0.27,<1",
]

[project.scripts]
llm-rag = "llm_rag.__main__:main"

[project.optional-dependencies]
sources = ["pypdf>=5,<7"]
vector = ["torch>=2.6,<3", "transformers>=4.57,<5", "huggingface-hub>=0.34,<1"]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "jsonschema>=4,<5",
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["app*", "llm_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
